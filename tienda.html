<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda - Tecnología y Perfumes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f7;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
        }
        .container {
            max-width: 900px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h2 {
            color: #2980b9;
        }
        .productos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            background: #fafafa;
        }
        .card img {
            max-width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 4px;
        }
        .precio {
            color: #2980b9;
            font-weight: bold;
            font-size: 1.1em;
        }
    </style>
</head>
<body>

    <header>
        <h1>Bienvenido a Mi Tienda Online</h1>
        <p>Tecnología y Perfumes de alta calidad</p>
    </header>

    <div class="container">
        <h2>Catálogo de Productos (Conectado a SQLite)</h2>
        <div id="lista-productos" class="productos-grid">
            <p>Cargando productos desde el servidor...</p>
        </div>
    </div>

    <script>
        // Cargar los productos desde nuestra API de Node.js
        fetch('/api/productos')
            .then(response => response.json())
            .then(productos => {
                const contenedor = document.getElementById('lista-productos');
                contenedor.innerHTML = '';
                
                if (productos.length === 0) {
                    contenedor.innerHTML = '<p>No hay productos registrados.</p>';
                    return;
                }

                productos.forEach(prod => {
                    const tarjeta = document.createElement('div');
                    tarjeta.className = 'card';
                    tarjeta.innerHTML = `
                        <img src="${prod.img}" alt="${prod.nombre}">
                        <h3>${prod.nombre}</h3>
                        <p>Categoría: ${prod.categoria}</p>
                        <p class="precio">$${prod.precio}</p>
                    `;
                    contenedor.appendChild(tarjeta);
                });
            })
            .catch(error => {
                console.error('Error al cargar productos:', error);
                document.getElementById('lista-productos').innerHTML = '<p style="color: red;">Error al conectar con el servidor.</p>';
            });
    </script>

</body>
</html>
